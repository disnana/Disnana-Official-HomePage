name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate sitemap.xml
      run: |
        DOMAIN="https://disnana.com"
        SITEMAP="sitemap.xml"

        echo '<?xml version="1.0" encoding="UTF-8"?>' > $SITEMAP
        echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> $SITEMAP

        find . -maxdepth 1 -type f -name '*.html' | while read -r file; do
          # 拡張子 .html を取り除いたファイル名を取得
          filename=$(basename "$file" .html)
          
          echo "  <url>" >> $SITEMAP
          echo "    <loc>${DOMAIN}/${filename}</loc>" >> $SITEMAP
          echo "    <lastmod>$(date +%Y-%m-%d)</lastmod>" >> $SITEMAP
          echo "  </url>" >> $SITEMAP
        done

        echo '</urlset>' >> $SITEMAP

    - name: Commit and Push sitemap
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add sitemap.xml
        
        if ! git diff --cached --quiet; then
          git commit -m "chore: update sitemap.xml [skip ci]"
          git push
        else
          echo "No changes in sitemap.xml"
        fi
