<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ページ移転のお知らせ</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7fb;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: min(90%, 520px);
      padding: 32px;
      box-sizing: border-box;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.6rem;
    }

    p {
      margin: 8px 0;
      line-height: 1.7;
    }

    a {
      color: #375dfb;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>ページが移転しました</h1>

    <p>
      新しいページへ
      <span id="countdown">3</span>
      秒後にリダイレクトします。
    </p>

    <p>
      自動的に移動しない場合は、<br>
      <a id="redirect-link" href="https://bot.disnana.com/">
        こちらをクリックしてください
      </a>
    </p>
  </main>

<script>
  const newPath = window.location.pathname.replace(/^\/bot(?=\/|$)/, "");

  const redirectUrl =
    "https://bot.disnana.com" +
    (newPath || "/") +
    window.location.search +
    window.location.hash;

  document.getElementById("redirect-link").href = redirectUrl;

  let remainingSeconds = 3;
  const countdown = document.getElementById("countdown");

  const timer = setInterval(() => {
    remainingSeconds--;
    countdown.textContent = remainingSeconds;

    if (remainingSeconds <= 0) {
      clearInterval(timer);
      window.location.replace(redirectUrl);
    }
  }, 1000);
</script>
</body>
</html>
